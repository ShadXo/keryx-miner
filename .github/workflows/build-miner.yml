name: build-miner

on:
  workflow_dispatch:
    inputs:
      # Matches build.rs's own default. 89-virtual PTX only JITs FORWARD, so dropping
      # 75-real/80-real leaves Turing and A100 with no loadable llama image at all — no OPoI
      # inference, and PoM uploads its own weight copy instead of the zero-dup gather.
      # Narrow it deliberately (e.g. "86-real;89-real;89-virtual") for a faster, smaller
      # build when you know the target fleet.
      llama_archs:
        description: "llama.cpp CUDA archs (CMake syntax). Narrow it to shrink the build if your fleet has no Turing/A100."
        default: "75-real;80-real;86-real;89-real;89-virtual"
      # Defaults to native: `ptx` empties the nextgen fatbin, which sends every cc >= 8.9 card
      # down the PTX ladder — and that ladder tops out at sm_90, so Blackwell JITs instead of
      # running SASS. `ptx` stays available for debugging the fallback path itself.
      nextgen_kernel:
        description: "How RTX 40xx/50xx get the new PoM kernel"
        type: choice
        options: [native, ptx]
        default: native
      bundle_cuda_runtime:
        description: "Ship libcudart/libcublas beside the binary, for hosts with a driver but no CUDA toolkit. Adds ~400 MB zipped (libcublasLt alone is 526 MB)."
        type: boolean
        default: false

  # Lets deploy.yaml reuse this build instead of duplicating it. Inputs must mirror the
  # workflow_dispatch set above; note nextgen_kernel is `string` here because workflow_call
  # has no `choice` type.
  workflow_call:
    inputs:
      llama_archs:
        type: string
        default: "75-real;80-real;86-real;89-real;89-virtual"
      nextgen_kernel:
        type: string
        default: native
      bundle_cuda_runtime:
        type: boolean
        default: false

# NOTE: POM_SM_LIST is deliberately NOT set. pom_gpu.rs include_str!s all seven
# PTX files unconditionally, so trimming the list breaks the build.

env:
  LLAMA_TAG: b10015
  # ubuntu20.04 is what pins glibc to 2.31 (HiveOS compatibility) — the CUDA version is
  # independent of it. 12.8 rather than 12.2 because build.rs compiles the PoM PTX ladder with
  # THIS toolkit: nvcc 12.2 emits PTX ISA 8.2 from a compiler that has never heard of sm_120, and
  # JIT-ing that onto Blackwell is measurably slower than ISA 8.7. Only reachable when the
  # nextgen fatbin fails to load, but there is no reason to leave the fallback crippled.
  BUILD_IMAGE: nvidia/cuda:12.8.2-devel-ubuntu20.04   # glibc 2.31, gcc 9
  # Must be <= the CUDA version your DRIVER reports (see "CUDA driver API version"
  # in the miner log). A fatbin from a newer toolkit fails with "device kernel
  # image is invalid". 12.8 toolkit -> needs driver r570+.
  FATBIN_IMAGE: nvidia/cuda:12.8.2-devel-ubuntu20.04

jobs:
  # Only runs for nextgen_kernel=native. The shipped cuda/pom_mine_nextgen.fatbin
  # is stale (predates the ILP x2 commit); this rebuilds it from current source.
  #
  # The gencode set must cover every cc that pom_gpu.rs::is_nextgen_device routes
  # here (major > 8, or 8.9) — that includes sm_90. compute_120 PTX cannot JIT
  # *down* to Hopper, so omitting sm_90 makes the nextgen load fail there and the
  # card silently drops to the legacy fatbin's sm_86 PTX at reduced throughput.
  fatbin:
    if: inputs.nextgen_kernel == 'native'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile nextgen fatbin
        run: |
          docker run --rm -v "$PWD":/src -w /src "$FATBIN_IMAGE" \
            nvcc -fatbin -O3 \
              -gencode arch=compute_89,code=sm_89 \
              -gencode arch=compute_90,code=sm_90 \
              -gencode arch=compute_100,code=sm_100 \
              -gencode arch=compute_120,code=sm_120 \
              -gencode arch=compute_120,code=compute_120 \
              cuda/pom_mine.cu -o pom_mine_nextgen.fatbin
          sudo chown "$(id -u):$(id -g)" pom_mine_nextgen.fatbin
          ls -la pom_mine_nextgen.fatbin

      # The LEGACY image needs rebuilding for the same reason as nextgen, and it is easy to
      # miss because the bug is silent. Every cc < 8.9 card loads this one, and the committed
      # copy is upstream's — where `pom_mine` IS the ILP x2 kernel. In this fork `pom_mine` is
      # ILP1 and the two-nonce variant is `pom_mine_ilp2`, so shipping upstream's image leaves
      # our host launching `batch` threads at a kernel that grinds two nonces each: coverage
      # stays correct (the kernel's own i0 >= n_nonces guard stops the overshoot) but half the
      # threads exit immediately and the autotune cannot offer ILP2 at all. Building it here
      # gives Ampere both entry points and a real measurement, exactly like Blackwell.
      # -Wno-deprecated-gpu-targets: sm_61/70 are deprecated in 12.x (removed in 13.x) and
      # warn loudly; still fully supported by this toolkit.
      - name: Compile legacy fatbin
        run: |
          docker run --rm -v "$PWD":/src -w /src "$FATBIN_IMAGE" \
            nvcc -fatbin -O3 -Wno-deprecated-gpu-targets \
              -gencode arch=compute_61,code=sm_61 \
              -gencode arch=compute_70,code=sm_70 \
              -gencode arch=compute_75,code=sm_75 \
              -gencode arch=compute_80,code=sm_80 \
              -gencode "arch=compute_86,code=[compute_86,sm_86]" \
              cuda/pom_mine.cu -o pom_mine_legacy.fatbin
          sudo chown "$(id -u):$(id -g)" pom_mine_legacy.fatbin
          ls -la pom_mine_legacy.fatbin

      # PoW (KeryxHash) nextgen images. The COMMITTED ones are built with CUDA 12.9, so their
      # sm_100/sm_120 PTX is ISA 8.8 and needs driver >= r575; on r570 a Blackwell card fails
      # every nextgen image and walks the ladder down to JIT'd sm_86. Rebuilding here with the
      # 12.8 toolkit emits ISA 8.7 / native SASS that an r570 driver accepts.
      # Arch set mirrors the committed fatbin exactly: ptx_89 sass_89 sass_90 sass_100 sass_120.
      - name: Compile PoW nextgen fatbin + sm_120 PTX
        run: |
          docker run --rm -v "$PWD":/src -w /src "$FATBIN_IMAGE" bash -euo pipefail -c '
            cd plugins/cuda/kaspa-cuda-native/src
            nvcc -fatbin -O3 \
              -gencode "arch=compute_89,code=[compute_89,sm_89]" \
              -gencode arch=compute_90,code=sm_90 \
              -gencode arch=compute_100,code=sm_100 \
              -gencode arch=compute_120,code=sm_120 \
              kaspa-cuda.cu -o /src/keryx-nextgen.fatbin
            nvcc -ptx -O3 -arch=compute_120 kaspa-cuda.cu -o /src/keryx-cuda-sm120.ptx
          '
          sudo chown "$(id -u):$(id -g)" keryx-nextgen.fatbin keryx-cuda-sm120.ptx
          ls -la keryx-nextgen.fatbin keryx-cuda-sm120.ptx
          # Must read 8.7 (CUDA 12.8). 8.8 means the wrong toolkit and no r570 support.
          grep -m1 '^\.version' keryx-cuda-sm120.ptx

      - uses: actions/upload-artifact@v4
        with:
          name: nextgen-fatbin
          path: |
            pom_mine_nextgen.fatbin
            pom_mine_legacy.fatbin
            keryx-nextgen.fatbin
            keryx-cuda-sm120.ptx

  build:
    needs: [fatbin]
    if: always() && needs.fatbin.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          docker-images: false

      - uses: actions/checkout@v4

      - name: Fetch native fatbin
        if: inputs.nextgen_kernel == 'native'
        uses: actions/download-artifact@v4
        with:
          name: nextgen-fatbin
          path: .

      # worker.rs pulls these in with include_bytes!/include_str! straight from the source
      # tree, so overwriting them before cargo build is what swaps in the r570-compatible
      # images. (PoM takes the env-var route instead — build.rs copies POM_FATBIN_NEXTGEN.)
      - name: Install rebuilt PoW images
        if: inputs.nextgen_kernel == 'native'
        run: |
          cp keryx-nextgen.fatbin  plugins/cuda/resources/keryx-nextgen.fatbin
          cp keryx-cuda-sm120.ptx  plugins/cuda/resources/keryx-cuda-sm120.ptx
          ls -la plugins/cuda/resources/keryx-nextgen.fatbin plugins/cuda/resources/keryx-cuda-sm120.ptx

      - name: Cache llama engine
        uses: actions/cache@v4
        with:
          path: dist/libkeryx-llama.so
          # Bump the suffix whenever build.rs changes how the .so is LINKED — a cache hit sets
          # KERYX_LLAMA_SKIP=1 and reuses the old binary, so a link-flag change (here:
          # -rpath,$ORIGIN) would otherwise never reach the shipped artifact.
          key: llama-${{ env.LLAMA_TAG }}-${{ inputs.llama_archs }}-cuda1282-rpath1-nehalem1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            target
          key: cargo-${{ github.sha }}
          restore-keys: cargo-

      - name: Build
        run: |
          mkdir -p dist
          # ptx  -> empty image, load fails, falls through to the PTX ladder
          # native -> freshly compiled SASS from the fatbin job
          #
          # For ptx the path must NOT exist: build.rs fs::copy()s the file when it
          # exists (and fs::copy rejects /dev/null), and only writes the empty
          # placeholder we want when the path is missing.
          if [ "${{ inputs.nextgen_kernel }}" = "native" ]; then
            NG="pom_mine_nextgen.fatbin"
            LEG="pom_mine_legacy.fatbin"
          else
            NG="/src/cuda/__no_nextgen.fatbin"
            # ptx mode keeps the committed legacy image (build.rs's own default path), so the
            # fallback path is exercised as shipped rather than as rebuilt.
            LEG="cuda/pom_mine_legacy.fatbin"
          fi
          docker run --rm -v "$PWD":/src -w /src \
            -e CARGO_HOME=/src/.cargo-home \
            -e CARGO_TARGET_DIR=/src/target \
            -e KERYX_LLAMA_ARCHS="${{ inputs.llama_archs }}" \
            -e POM_FATBIN_NEXTGEN="$NG" \
            -e POM_FATBIN_LEGACY="$LEG" \
            "$BUILD_IMAGE" bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq curl git build-essential pkg-config \
                libssl-dev ca-certificates protobuf-compiler >/dev/null

              curl -sL https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz \
                | tar xz -C /opt
              export PATH=/opt/cmake-3.28.6-linux-x86_64/bin:/usr/local/cuda/bin:$PATH
              export CUDA_HOME=/usr/local/cuda
              export NVCC=/usr/local/cuda/bin/nvcc
              export PROTOC=/usr/bin/protoc
              git config --global --add safe.directory "*"

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
              . "$CARGO_HOME/env"
              rustc -vV

              if [ -f dist/libkeryx-llama.so ]; then
                echo "::notice::reusing cached libkeryx-llama.so"
                export KERYX_LLAMA_SKIP=1
              fi

              cargo build --release -p keryx-miner -p keryxcuda

              strip target/release/keryx-miner
              [ -f target/release/libkeryx-llama.so ] && cp target/release/libkeryx-llama.so dist/

              mkdir -p pkg
              cp target/release/keryx-miner pkg/
              cp target/release/libkeryxcuda.so pkg/
              cp dist/libkeryx-llama.so pkg/
              # libkeryx-llama.so has DT_NEEDED on libcudart.so.12 and libcublas.so.12 (which
              # itself needs libcublasLt.so.12). Rigs usually carry only the driver, so the
              # dlopen fails, OPoI inference is unavailable, and PoM falls back to uploading a
              # SECOND copy of the weights instead of the zero-dup gather. The .so is linked
              # with -rpath,$ORIGIN, so these are found simply by sitting beside it.
              if [ "${{ inputs.bundle_cuda_runtime }}" = "true" ]; then
                for lib in libcudart.so.12 libcublas.so.12 libcublasLt.so.12; do
                  cp -L "/usr/local/cuda/lib64/$lib" pkg/
                done
              fi
              ls -la pkg/
            '
          sudo chown -R "$(id -u):$(id -g)" .

      - uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-${{ inputs.nextgen_kernel }}-${{ github.sha }}
          path: pkg/
          retention-days: 14
