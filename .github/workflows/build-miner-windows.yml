name: build-miner-windows

# UNVERIFIED. The Linux workflow was written against a read of build.rs; this one
# follows the same logic but the MSVC path has not been exercised. Expect to iterate.

on:
  workflow_dispatch:
    inputs:
      llama_archs:
        description: "llama.cpp CUDA archs (CMake syntax)"
        default: "86-real;89-real;89-virtual"
      nextgen_kernel:
        description: "How RTX 40xx/50xx get the new PoM kernel"
        type: choice
        options: [ptx, native]
        default: ptx
      bundle_cuda_runtime:
        description: "Ship cublas/cublasLt DLLs beside the exe, for boxes with a driver but no CUDA toolkit. Adds ~610 MB zipped (cublasLt alone is 675 MB)."
        type: boolean
        default: false

env:
  LLAMA_TAG: b10015
  # CUDA 12.2 rejects the cl.exe on current windows images, so this is newer than
  # the Linux build's. Keep it <= the CUDA version your Windows driver reports, or
  # the kernels fail to load. Two-digit form resolves to the latest patch release.
  CUDA_VERSION: "12.8.1"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        # build.rs shells out to git for llama.cpp; keep CRLF out of the sources
      - run: git config --global core.autocrlf false

      - uses: ilammy/msvc-dev-cmd@v1   # puts cl.exe on PATH for nvcc

      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          # NOTE: sub-packages is documented as Linux+network only, so this is likely
          # ignored on Windows and you get the full toolkit (~4 GB). If disk runs out,
          # that is the first thing to attack.
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand","curand_dev","thrust","visual_studio_integration"]'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Without this the PoM nextgen fatbin is empty and cc 12.0 falls through the
      # PTX ladder to sm_90 PTX (POM_SM_LIST tops out at 90 — there is no sm_120
      # PoM PTX), so a 50-series card JITs instead of running native SASS.
      # nvcc needs cl.exe, which msvc-dev-cmd put on PATH above.
      - name: Compile nextgen fatbin
        if: inputs.nextgen_kernel == 'native'
        shell: pwsh
        run: |
          & "$env:CUDA_PATH\bin\nvcc.exe" -fatbin -O3 `
            -gencode arch=compute_89,code=sm_89 `
            -gencode arch=compute_90,code=sm_90 `
            -gencode arch=compute_100,code=sm_100 `
            -gencode arch=compute_120,code=sm_120 `
            -gencode arch=compute_120,code=compute_120 `
            cuda\pom_mine.cu -o pom_mine_nextgen.fatbin
          if ($LASTEXITCODE -ne 0) { throw "nvcc -fatbin failed" }
          Get-Item pom_mine_nextgen.fatbin | Select-Object Name,Length

      # Same treatment for the PoW (KeryxHash) plugin. Its COMMITTED resources are built with
      # CUDA 12.9, so keryx-cuda-sm120.ptx is ISA 8.8 and needs driver r575+; on r570 a
      # Blackwell card fails every nextgen image and the loader walks down to JIT'd sm_86.
      # The runner's 12.8 toolkit emits ISA 8.7 plus native SASS that r570 accepts.
      # Arch set mirrors the committed fatbin exactly: ptx_89 sass_89 sass_90 sass_100 sass_120.
      # NOTE: every -gencode value is quoted — PowerShell would otherwise try to read the
      # comma as an array separator.
      - name: Compile PoW nextgen fatbin + sm_120 PTX
        if: inputs.nextgen_kernel == 'native'
        shell: pwsh
        run: |
          $nvcc = "$env:CUDA_PATH\bin\nvcc.exe"
          $src  = "plugins\cuda\kaspa-cuda-native\src"
          Push-Location $src
          & $nvcc -fatbin -O3 `
            -gencode "arch=compute_89,code=[compute_89,sm_89]" `
            -gencode "arch=compute_90,code=sm_90" `
            -gencode "arch=compute_100,code=sm_100" `
            -gencode "arch=compute_120,code=sm_120" `
            kaspa-cuda.cu -o keryx-nextgen.fatbin
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "nvcc -fatbin (PoW) failed" }
          & $nvcc -ptx -O3 -arch=compute_120 kaspa-cuda.cu -o keryx-cuda-sm120.ptx
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "nvcc -ptx (PoW) failed" }
          Pop-Location
          # worker.rs include_bytes!/include_str!s these from the source tree, so overwriting
          # them before cargo build is what swaps in the r570-compatible images.
          Copy-Item "$src\keryx-nextgen.fatbin" plugins\cuda\resources\keryx-nextgen.fatbin -Force
          Copy-Item "$src\keryx-cuda-sm120.ptx" plugins\cuda\resources\keryx-cuda-sm120.ptx -Force
          Get-Item plugins\cuda\resources\keryx-nextgen.fatbin, plugins\cuda\resources\keryx-cuda-sm120.ptx |
            Select-Object Name,Length
          # Must read 8.7 (CUDA 12.8). 8.8 would mean the wrong toolkit and no r570 support.
          Select-String -Path plugins\cuda\resources\keryx-cuda-sm120.ptx -Pattern '^\.version' |
            Select-Object -First 1 -ExpandProperty Line

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-win-${{ github.sha }}
          restore-keys: cargo-win-

      - name: Build
        shell: pwsh
        env:
          KERYX_LLAMA_ARCHS: ${{ inputs.llama_archs }}
          # native -> freshly compiled SASS from the step above (path is relative to
          #           the root package dir, which is where build.rs runs).
          # ptx    -> path must NOT exist, so build.rs writes an empty placeholder,
          #           the stale committed nextgen fatbin is skipped, and the PTX
          #           ladder is used instead.
          POM_FATBIN_NEXTGEN: ${{ inputs.nextgen_kernel == 'native' && 'pom_mine_nextgen.fatbin' || 'cuda\__no_nextgen.fatbin' }}
        run: |
          $env:NVCC = "$env:CUDA_PATH\bin\nvcc.exe"
          cargo build --release -p keryx-miner -p keryxcuda

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item target\release\keryx-miner.exe pkg\
          Copy-Item target\release\keryxcuda.dll   pkg\
          Copy-Item target\release\keryx-llama.dll pkg\
          # cudart is linked statically by nvcc, but cublas is not. keryx-llama.dll cannot load
          # without cublas/cublasLt, so a box with only the NVIDIA driver (no CUDA toolkit)
          # needs them shipped -- at the cost of ~610 MB, nearly all of it cublasLt. Opt-in:
          # without it OPoI inference is unavailable and PoM uploads its own weight copy,
          # while mining itself still runs.
          if ("${{ inputs.bundle_cuda_runtime }}" -eq "true") {
            foreach ($dll in @('cublas64_12.dll','cublasLt64_12.dll')) {
              $p = Join-Path $env:CUDA_PATH "bin\$dll"
              # A silently missing DLL only surfaces as a runtime load failure on the miner,
              # so fail the build instead.
              if (-not (Test-Path $p)) { throw "required redist DLL missing: $p" }
              Copy-Item $p pkg\
            }
            # curand is not in keryx-llama.dll's import table; ship it if present, no more.
            Copy-Item "$env:CUDA_PATH\bin\curand64_10.dll" pkg\ -ErrorAction SilentlyContinue
          }
          Get-ChildItem pkg

      - uses: actions/upload-artifact@v4
        with:
          name: keryx-miner-win64-${{ inputs.nextgen_kernel }}-${{ github.sha }}
          path: pkg/
          retention-days: 14
