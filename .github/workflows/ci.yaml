name: Tests

# Fast correctness gate: compile the workspace and run the unit tests on every push.
# Deliberately NOT a packaging build — build-miner.yml does that and takes ~10 minutes.
#
# Two things make this viable at all:
#   * KERYX_LLAMA_SKIP=1 — build.rs otherwise clones llama.cpp and cmake-builds it, which
#     dominates the runtime. Nothing here loads the engine, so skipping it is free.
#   * nvcc is still REQUIRED: build.rs compiles cuda/pom_mine.cu to PTX unconditionally and
#     pom_gpu.rs include_str!s all seven outputs, so there is no CUDA-less build path.
# No GPU is present on the runner, so this compiles and runs host-side tests only.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CUDA_VERSION: "12.8.1"

jobs:
  test:
    name: Check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA (nvcc only)
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc","cudart"]'

      # The test binary links the CUDA DRIVER (libcuda.so.1) since the v3/H6 work, and a CI
      # runner has no GPU and no driver. The toolkit ships a stub for exactly this case, but
      # only as `libcuda.so` — the loader wants the `.1` soname, so symlink it and put the stub
      # directory on the loader path. Host-side tests never call into it; this only satisfies
      # load-time resolution.
      - name: CUDA driver stub for host-side tests
        run: |
          sudo ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-

      # Two upstream tests are skipped, NOT fixed. src/pow/heavy_hash.rs is byte-identical
      # to upstream and contains wave_mix (Keryx's ARX post-processing on top of the kaspa
      # PoW), but test_heavy_hash and test_generate_matrix still assert kaspa-era hardcoded
      # vectors from before that change, so they fail on a clean upstream checkout too.
      # Regenerating the expected values from the current implementation would make them
      # assert only that the code equals itself — worthless for a consensus hash — so they
      # stay skipped until upstream supplies real post-wave_mix vectors.
      - name: Unit tests
        env:
          KERYX_LLAMA_SKIP: "1"
          NVCC: /usr/local/cuda/bin/nvcc
        run: |
          cargo test -p keryx-miner -- \
            --skip pow::heavy_hash::tests::test_heavy_hash \
            --skip pow::heavy_hash::tests::test_generate_matrix

      # keryxcuda is a cdylib plugin with no unit tests of its own; type-check it so a
      # break in worker.rs (the PoW image-selection ladder) fails here rather than in a
      # ten-minute packaging build.
      - name: Type-check the CUDA plugin
        env:
          KERYX_LLAMA_SKIP: "1"
          NVCC: /usr/local/cuda/bin/nvcc
        run: cargo check -p keryxcuda --tests
